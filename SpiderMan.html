<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Slinger</title>
<style>
:root{color-scheme:dark;--bg:#0b0e24;--hot:#ff5a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#wrap{position:relative;width:min(100%,calc(100vh*16/9));container-type:inline-size}
canvas{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5cqw;padding:2cqw;box-sizing:border-box;background:rgba(8,10,30,.74);color:#fff;text-align:center;overflow:auto}
#ov.off{display:none}
h1{margin:0;font-size:clamp(20px,6cqw,56px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
p{margin:0;font-size:clamp(10px,1.9cqw,17px);color:#ffd9cc;max-width:42em;line-height:1.35}
.row{display:flex;gap:1cqw;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{font:inherit;font-size:clamp(10px,2cqw,17px);font-weight:600;padding:.45em 1em;border-radius:999px;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;align-items:center;gap:.5em}
.chip.sk{padding:.35em}
.chip[aria-pressed=true]{border-color:var(--hot);background:rgba(255,90,107,.28)}
.chip:focus-visible,#play:focus-visible{outline:3px solid #fff;outline-offset:2px}
.dot{display:block;width:1.5em;height:1.5em;border-radius:50%}
#skn{font-size:clamp(10px,1.9cqw,16px);min-width:6em;text-align:left;color:#fff}
#play{font:inherit;font-size:clamp(12px,2.6cqw,22px);font-weight:800;padding:.55em 2em;border:0;border-radius:999px;background:var(--hot);color:#1a0b14;cursor:pointer}
#play:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="960" height="540"></canvas>
<div id="ov">
  <h1 id="ttl">Web Slinger</h1>
  <p id="sub"></p>
  <div class="row" id="dif" role="group" aria-label="Level"></div>
  <p id="dsc"></p>
  <div class="row" role="group" aria-label="Skin"><span class="row" id="sks"></span><span id="skn"></span></div>
  <button id="play">Play</button>
</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540,FOOT=20,RUN=270,K={l:0,r:0,d:0};
const rnd=(a,b)=>a+Math.random()*(b-a);
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const D={
  easy:{n:'Easy',g:1250,gap:[190,270],ay:[80,150],h:[60,130],range:540,reel:140,pump:560,snap:0,mult:1,coin:[100,170],sky:['#1d2a6b','#6a4c93','#f4a261'],d:'Close web points, low rooftops, no web timer.'},
  medium:{n:'Medium',g:1500,gap:[240,330],ay:[70,170],h:[70,190],range:480,reel:170,pump:520,snap:0,mult:1.5,coin:[110,210],sky:['#141a3d','#5b3a7a','#f08a5d'],d:'Balanced gaps and gravity. Score x1.5.'},
  hard:{n:'Hard',g:1650,gap:[290,390],ay:[60,190],h:[90,230],range:480,reel:200,pump:500,snap:3.2,mult:2,coin:[130,230],sky:['#1a0f2e','#6b2d5c','#e0556a'],d:'Far web points, tall towers, your web snaps after 3 seconds. Score x2.'},
  insane:{n:'Insane',g:1800,gap:[340,450],ay:[50,200],h:[110,250],range:520,reel:230,pump:480,snap:2.1,mult:3,coin:[150,260],sky:['#0a0612','#4a0f2a','#ff3b3b'],d:'Huge gaps, heavy gravity, your web snaps after 2 seconds. Score x3.'}
};
const SK={
  classic:{n:'Classic',head:'#d91f33',body:'#2250d8',legs:'#d91f33',eye:'#fff',web:'#fff',acc:'#7a0f1b'},
  midnight:{n:'Midnight',head:'#1b1b24',body:'#1b1b24',legs:'#d91f33',eye:'#fff',web:'#ff8a96',acc:'#d91f33'},
  neon:{n:'Neon',head:'#ff2fb3',body:'#18e0ff',legs:'#ff2fb3',eye:'#0b0e24',web:'#7df9ff',acc:'#fff'},
  gold:{n:'Gold',head:'#f5c431',body:'#fff5d6',legs:'#f5c431',eye:'#2a1a00',web:'#ffe28a',acc:'#b8860b'},
  ghost:{n:'Ghost',head:'#e8ecf5',body:'#7a86a8',legs:'#e8ecf5',eye:'#0b0e24',web:'#cfe0ff',acc:'#fff'},
  toxic:{n:'Toxic',head:'#7dff4f',body:'#2b2b3a',legs:'#7dff4f',eye:'#0b0e24',web:'#b6ff9a',acc:'#7dff4f'}
};
let diff='medium',skin='classic',bests={},cfg,state='ready',held=false,flash=0;
let P,anch,blds,coins,trail,cam,camY,tokens,dist,bx,axc,cxc,lastScore=0,newBest=false;
try{const s=JSON.parse(localStorage.getItem('ws2')||'{}');if(D[s.diff])diff=s.diff;if(SK[s.skin])skin=s.skin;if(s.bests&&typeof s.bests==='object')bests=s.bests}catch(e){}
function save(){try{localStorage.setItem('ws2',JSON.stringify({diff,skin,bests}))}catch(e){}}
const total=()=>Math.floor((dist+tokens*10)*cfg.mult);

function gen(lim){
  while(bx<lim){const w=rnd(90,170);blds.push({x:bx,w,h:rnd(cfg.h[0],cfg.h[1]),s:Math.floor(rnd(1,9999))});bx+=w+rnd(15,55)}
  while(axc<lim){anch.push({x:axc,y:rnd(cfg.ay[0],cfg.ay[1])});axc+=rnd(cfg.gap[0],cfg.gap[1])}
  while(cxc<lim){coins.push({x:cxc,y:rnd(110,330),got:false});cxc+=rnd(cfg.coin[0],cfg.coin[1])}
}
function reset(){
  cfg=D[diff];
  P={x:120,y:160,vx:260,vy:-260,att:null,L:0,minL:0,age:0,webT:1,on:false,face:1,t:0};
  anch=[{x:300,y:110}];blds=[];coins=[];trail=[];bx=-300;axc=300+rnd(cfg.gap[0],cfg.gap[1]);cxc=380;
  cam=0;camY=0;tokens=0;dist=0;gen(1800);
}
function pick(){
  let b=null,bs=1e9;
  for(const a of anch){
    const dx=a.x-P.x,dy=a.y-P.y,d=Math.hypot(dx,dy);
    if(dx<-50||dy>-20||d>cfg.range||d<60)continue;
    const s=Math.hypot(dx-170,dy+190)+(dx<0?120:0);
    if(s<bs){bs=s;b=a}
  }
  return b;
}
function tryAttach(){
  const a=pick();
  if(!a)return false;
  const d=Math.hypot(a.x-P.x,a.y-P.y);
  P.att=a;P.L=d;P.minL=Math.max(110,d*.6);P.age=0;P.webT=0;
  return true;
}
function die(){
  state='over';held=false;P.att=null;
  lastScore=total();
  newBest=lastScore>(bests[diff]||0);
  if(newBest){bests[diff]=lastScore;save()}
  showOv();
  const pl=document.getElementById('play');pl.disabled=true;
  setTimeout(()=>{pl.disabled=false;pl.focus()},600);
}
function step(dt){
  const mv=K.r-K.l;
  P.t+=dt;
  if(mv)P.face=mv;else if(Math.abs(P.vx)>60)P.face=P.vx>0?1:-1;
  P.vy+=cfg.g*dt;
  if(P.on&&!P.att)P.vx+=(mv*RUN-P.vx)*Math.min(1,dt*10);
  else{P.vx+=mv*(P.att?560:650)*dt;if(K.d)P.vy+=900*dt}
  if(P.att){
    P.age+=dt;P.webT+=dt*14;
    const dx=P.x-P.att.x,dy=P.y-P.att.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d,tx=ny,ty=-nx;
    if(!mv&&P.vx*tx+P.vy*ty<720){P.vx+=tx*cfg.pump*dt;P.vy+=ty*cfg.pump*dt}
    P.L=Math.max(P.minL,P.L-cfg.reel*dt);
    if(cfg.snap&&P.age>cfg.snap){P.att=null;held=false}
  }
  P.vx*=1-.08*dt;
  P.vx=Math.max(-1000,Math.min(1000,P.vx));
  P.vy=Math.min(P.vy,1100);
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  if(P.x<cam+24){P.x=cam+24;if(P.vx<0)P.vx=0}
  if(P.att){
    const dx=P.x-P.att.x,dy=P.y-P.att.y,d=Math.hypot(dx,dy)||1;
    if(d>P.L){
      const nx=dx/d,ny=dy/d;
      P.x=P.att.x+nx*P.L;P.y=P.att.y+ny*P.L;
      const vr=P.vx*nx+P.vy*ny;
      if(vr>0){P.vx-=vr*nx;P.vy-=vr*ny}
    }
  }
  P.on=false;
  for(const b of blds){
    if(P.x+7>b.x&&P.x-7<b.x+b.w){
      const pen=P.y+FOOT-(H-b.h);
      if(pen>0){
        if(pen<22){P.y=H-b.h-FOOT;if(P.vy>0)P.vy=0;P.on=true}
        else{P.x=P.x<b.x+b.w/2?b.x-7:b.x+b.w+7;P.vx=0}
      }
    }
  }
  if(P.y>H+60){die();return}
  for(const c of coins){
    if(!c.got&&Math.hypot(c.x-P.x,c.y-P.y)<26){c.got=true;tokens++}
  }
  dist=Math.max(dist,Math.floor((P.x-120)/10));
  if(bx<cam+W+600)gen(cam+W+1400);
  while(blds.length&&blds[0].x+blds[0].w<cam-300)blds.shift();
  while(anch.length&&anch[0].x<cam-300&&anch[0]!==P.att)anch.shift();
  while(coins.length&&coins[0].x<cam-300)coins.shift();
}
function limb(x,y,a1,l1,a2,l2,w,col){
  const kx=x+Math.sin(a1)*l1,ky=y+Math.cos(a1)*l1;
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(kx,ky);ctx.lineTo(kx+Math.sin(a2)*l2,ky+Math.cos(a2)*l2);ctx.stroke();
}
function hero(){
  const s=SK[skin];
  for(let i=0;i<trail.length;i++){
    ctx.globalAlpha=i/trail.length*.4;ctx.fillStyle=s.web;
    ctx.beginPath();ctx.arc(trail[i][0],trail[i][1],1.5+i*.45,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  const f=P.face,run=P.on&&Math.abs(P.vx)>25;
  let rot=0,lF=[.08,0],lB=[-.08,0],aF=[.12,.18],aB=[-.12,-.05];
  if(P.on){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(P.x,P.y+FOOT,11,3,0,0,7);ctx.fill()}
  if(P.att){
    const rx=P.att.x-P.x,ry=P.att.y-P.y;
    rot=Math.atan2(rx,-ry)*.8;
    const c=Math.cos(rot),sn=Math.sin(rot),lx=f*(rx*c+ry*sn),ly=-rx*sn+ry*c,ar=Math.atan2(lx,ly);
    lF=[-.35,-.5];lB=[-.6,-.85];aF=[ar,ar];aB=[-.7,-1];
  }else if(run){
    const ph=P.t*(9+Math.abs(P.vx)/45),sn=Math.sin(ph),cs=Math.cos(ph);
    rot=.12*f;
    lF=[sn*.9,sn*.9-.55-.35*cs];lB=[-sn*.9,-sn*.9-.55+.35*cs];
    aF=[-sn*.8,-sn*.8+.9];aB=[sn*.8,sn*.8+.9];
  }else if(!P.on){
    rot=Math.max(-.5,Math.min(.5,P.vx/900));
    lF=[.9,.1];lB=[-.45,-.9];aF=[1.4,1.7];aB=[-1,-1.3];
  }
  ctx.save();ctx.translate(P.x,P.y);ctx.rotate(rot);ctx.scale(f,1);
  ctx.globalAlpha=.7;
  limb(0,-7,aB[0],7,aB[1],7,3.8,s.head);
  limb(0,5,lB[0],7.5,lB[1],7.5,4.6,s.legs);
  ctx.globalAlpha=1;
  ctx.fillStyle=s.body;ctx.strokeStyle=s.acc;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.ellipse(0,-1.5,5.5,9.5,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=s.head;ctx.beginPath();ctx.moveTo(1.5,-6);ctx.lineTo(3.5,-3);ctx.lineTo(1.5,0);ctx.lineTo(-.5,-3);ctx.fill();
  limb(0,5,lF[0],7.5,lF[1],7.5,4.6,s.legs);
  ctx.fillStyle=s.head;ctx.strokeStyle=s.acc;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(1,-16,7.5,0,7);ctx.fill();ctx.stroke();
  ctx.save();ctx.globalAlpha=.45;ctx.beginPath();ctx.moveTo(1,-23.5);ctx.lineTo(1,-8.5);ctx.moveTo(-6.5,-16);ctx.lineTo(8.5,-16);ctx.stroke();ctx.restore();
  ctx.fillStyle=s.eye;ctx.strokeStyle=s.acc;ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(-1.2,-16.6,2.8,1.8,.35,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(4.6,-16.6,2.8,1.8,-.35,0,7);ctx.fill();ctx.stroke();
  limb(0,-7,aF[0],7,aF[1],7,3.8,s.head);
  ctx.restore();
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,cfg.sky[0]);g.addColorStop(.6,cfg.sky[1]);g.addColorStop(1,cfg.sky[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(20,14,50,.55)';
  const f=cam*.25,i0=Math.floor(f/70);
  for(let i=i0-1;i<i0+16;i++){const h=70+hash(i)*130;ctx.fillRect(i*70-f,H-h,62,h)}
  ctx.save();ctx.translate(-cam,-camY);
  for(const b of blds){
    if(b.x>cam+W||b.x+b.w<cam)continue;
    const top=H-b.h;
    ctx.fillStyle='#0f1330';ctx.fillRect(b.x,top,b.w,b.h+200);
    ctx.fillStyle='#1d2358';ctx.fillRect(b.x,top,b.w,5);
    const nc=Math.floor((b.w-12)/18),nr=Math.floor((b.h-14)/22);
    for(let i=0;i<nc;i++)for(let j=0;j<nr;j++){
      if(hash(b.s+i*17+j*53)>.55){
        ctx.fillStyle=hash(b.s*3+i+j)>.5?'#ffd37a':'#8fd3ff';
        ctx.fillRect(b.x+9+i*18,top+14+j*22,8,12);
      }
    }
  }
  const cand=(state==='play'&&!P.att)?pick():null;
  if(cand){
    ctx.setLineDash([4,7]);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(cand.x,cand.y);ctx.stroke();ctx.setLineDash([]);
  }
  for(const a of anch){
    const hot=a===cand||a===P.att;
    ctx.beginPath();ctx.arc(a.x,a.y,hot?9:6,0,7);
    ctx.fillStyle=hot?'#fff':'rgba(255,255,255,.5)';ctx.fill();
    if(hot){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(a.x,a.y,16,0,7);ctx.stroke()}
  }
  for(const c of coins){
    if(c.got||c.x<cam-20||c.x>cam+W+20)continue;
    ctx.beginPath();ctx.arc(c.x,c.y,8,0,7);ctx.fillStyle='#ffc93c';ctx.fill();
    ctx.strokeStyle='#fff3b0';ctx.lineWidth=2;ctx.stroke();
  }
  if(P.att){
    const e=Math.min(1,P.webT),ex=P.x+(P.att.x-P.x)*e,ey=P.y+(P.att.y-P.y)*e;
    ctx.strokeStyle=(cfg.snap&&P.age>cfg.snap*.7)?'#ff6b6b':SK[skin].web;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(ex,ey);ctx.stroke();
  }
  hero();
  ctx.restore();
  ctx.textAlign='left';ctx.font='700 28px system-ui,sans-serif';ctx.fillStyle='#fff';
  ctx.fillText(total(),24,42);
  ctx.font='500 14px system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.fillText(cfg.n+'   Best '+(bests[diff]||0)+'   Coins '+tokens,24,64);
  ctx.textAlign='right';ctx.fillText('A/D move   W or Space jump and web   S dive',W-24,32);ctx.textAlign='left';
  if(flash>0){ctx.textAlign='center';ctx.font='600 16px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText('No web point in range yet. Keep holding.',W/2,H-30)}
}
/* menu */
const $=id=>document.getElementById(id);
function mark(){
  for(const b of $('dif').children)b.setAttribute('aria-pressed',b.dataset.k===diff);
  for(const b of $('sks').children)b.setAttribute('aria-pressed',b.dataset.k===skin);
  $('dsc').textContent=D[diff].d;$('skn').textContent=SK[skin].n;
}
for(const k in D){const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=D[k].n;b.onclick=()=>{diff=k;save();mark();preview()};$('dif').appendChild(b)}
for(const k in SK){
  const s=SK[k],b=document.createElement('button');
  b.className='chip sk';b.dataset.k=k;b.title=s.n;b.setAttribute('aria-label',s.n+' skin');
  b.innerHTML='<span class="dot" style="background:linear-gradient(135deg,'+s.head+' 50%,'+s.body+' 50%)"></span>';
  b.onclick=()=>{skin=k;save();mark()};$('sks').appendChild(b);
}
function preview(){reset()}
function showOv(){
  $('ov').classList.remove('off');
  if(state==='over'){
    $('ttl').textContent='You hit the skyline';
    $('sub').textContent='Score '+lastScore+(newBest?' (new best on '+cfg.n+')':'  |  Best '+(bests[diff]||0));
    $('play').textContent='Play again';
  }else{
    $('ttl').textContent='Web Slinger';
    $('sub').textContent='A and D move. W or Space jumps, then hold it to web-swing from the glowing point. S dives. On touch, tap to jump and web.';
    $('play').textContent='Play';
  }
  mark();
}
function start(){
  $('ov').classList.add('off');
  reset();state='play';held=false;K.l=K.r=K.d=0;
}
$('play').onclick=start;
/* input */
function down(){
  if(state!=='play')return;
  held=true;
  if(P.on&&!P.att){P.vy=-cfg.g*.38;P.on=false}
  else if(!P.att&&!tryAttach())flash=.35;
}
function up(){held=false;if(P)P.att=null}
cv.addEventListener('pointerdown',e=>{e.preventDefault();down()});
addEventListener('pointerup',up);addEventListener('pointercancel',up);
const KM={KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',KeyS:'d',ArrowDown:'d'};
const isW=e=>e.code==='Space'||e.code==='KeyW'||e.code==='ArrowUp';
addEventListener('keydown',e=>{
  if(state!=='play')return;
  if(KM[e.code]){e.preventDefault();K[KM[e.code]]=1}
  if(isW(e)){e.preventDefault();if(!e.repeat)down()}
});
addEventListener('keyup',e=>{
  if(KM[e.code])K[KM[e.code]]=0;
  if(isW(e))up();
});
addEventListener('blur',()=>{K.l=K.r=K.d=0;up()});
/* loop */
reset();showOv();$('play').focus();
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'){
    if(held&&!P.att)tryAttach();
    step(dt/2);if(state==='play')step(dt/2);
    if(state==='play'){
      trail.push([P.x,P.y]);if(trail.length>12)trail.shift();
      cam+=(P.x-260-cam)*Math.min(1,dt*6);
      camY+=(Math.min(0,P.y-150)-camY)*Math.min(1,dt*4);
    }
  }
  if(flash>0)flash-=dt;
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
